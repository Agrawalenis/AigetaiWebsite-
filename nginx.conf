# ============================================================
#  Nginx config for aigetai.com
#  Place this file at: /etc/nginx/sites-available/aigetai.com
#  Then: sudo ln -s /etc/nginx/sites-available/aigetai.com /etc/nginx/sites-enabled/
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aigetai.com www.aigetai.com;

    # Let's Encrypt ACME challenge (needed for certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aigetai.com www.aigetai.com;

    # ── SSL (Let's Encrypt — filled in by certbot) ──
    ssl_certificate     /etc/letsencrypt/live/aigetai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aigetai.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Root (React build folder) ──
    root /var/www/aigetai/build;
    index index.html;

    # ── Gzip compression ──
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # ── Security headers ──
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Cache: hashed static assets (JS/CSS bundles) ──
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Cache: other public assets ──
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── React Router: always serve index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Block hidden files ──
    location ~ /\. {
        deny all;
    }
}
